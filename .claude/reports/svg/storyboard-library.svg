<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="ui-monospace, 'SF Mono', monospace">
  <rect width="1200" height="700" fill="#0f0f0f"/>

  <text x="600" y="36" text-anchor="middle" fill="#a78bfa" font-size="18" font-weight="bold">Library — Track Management</text>
  <text x="600" y="56" text-anchor="middle" fill="#6b7280" font-size="11">Spotify Import · Download · Grid/List View · Analysis Sidebar</text>

  <!-- Frame dividers -->
  <line x1="400" y1="70" x2="400" y2="680" stroke="#1f2937" stroke-width="1"/>
  <line x1="800" y1="70" x2="800" y2="680" stroke="#1f2937" stroke-width="1"/>
  <line x1="0" y1="380" x2="400" y2="380" stroke="#1f2937" stroke-width="1"/>
  <line x1="400" y1="380" x2="800" y2="380" stroke="#1f2937" stroke-width="1"/>
  <line x1="800" y1="380" x2="1200" y2="380" stroke="#1f2937" stroke-width="1"/>

  <!-- === FRAME 1: Spotify Import === -->
  <text x="200" y="90" text-anchor="middle" fill="#9ca3af" font-size="10" font-weight="bold">1. SPOTIFY URL IMPORT</text>
  <rect x="20" y="100" width="360" height="260" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>

  <!-- Paste URL input -->
  <rect x="35" y="120" width="280" height="32" rx="4" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
  <text x="50" y="140" fill="#6b7280" font-size="10">Paste a Spotify URL or track link...</text>
  <rect x="322" y="120" width="55" height="32" rx="4" fill="#1db954"/>
  <text x="349" y="140" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Import</text>

  <!-- URL examples -->
  <text x="50" y="170" fill="#374151" font-size="8">Examples:</text>
  <text x="50" y="183" fill="#374151" font-size="8">https://open.spotify.com/track/...</text>
  <text x="50" y="196" fill="#374151" font-size="8">https://open.spotify.com/playlist/...</text>
  <text x="50" y="209" fill="#374151" font-size="8">https://open.spotify.com/album/...</text>

  <!-- Import progress -->
  <rect x="35" y="225" width="330" height="35" rx="4" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="50" y="240" fill="#6b7280" font-size="8">Fetching metadata from Spotify API...</text>
  <rect x="35" y="248" width="330" height="6" rx="3" fill="#1f2937"/>
  <rect x="35" y="248" width="180" height="6" rx="3" fill="#1db954"/>

  <!-- Imported track card -->
  <rect x="35" y="270" width="330" height="60" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <rect x="35" y="270" width="60" height="60" rx="4" fill="#374151"/>
  <text x="65" y="304" text-anchor="middle" fill="#6b7280" font-size="18">&#9835;</text>
  <text x="108" y="290" fill="#e5e7eb" font-size="11" font-weight="bold">Levitating</text>
  <text x="108" y="305" fill="#9ca3af" font-size="9">Dua Lipa ft. DaBaby</text>
  <text x="108" y="318" fill="#6b7280" font-size="8">2020 · Pop · 3:23</text>
  <rect x="280" y="278" width="70" height="22" rx="3" fill="#7c3aed"/>
  <text x="315" y="293" text-anchor="middle" fill="white" font-size="8">Add to Lib</text>
  <text x="200" y="350" text-anchor="middle" fill="#6b7280" font-size="9">Track saved, Oban DownloadWorker queued</text>
  <text x="200" y="364" text-anchor="middle" fill="#6b7280" font-size="9">Playlist import: creates track per item</text>

  <!-- === FRAME 2: Grid View === -->
  <text x="600" y="90" text-anchor="middle" fill="#9ca3af" font-size="10" font-weight="bold">2. TRACK GRID VIEW</text>
  <rect x="420" y="100" width="360" height="260" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>

  <!-- Grid cards -->
  <g>
    <rect x="435" y="115" width="100" height="110" rx="4" fill="#1f2937"/>
    <rect x="435" y="115" width="100" height="70" rx="4" fill="#374151"/>
    <text x="485" y="155" text-anchor="middle" fill="#6b7280" font-size="24">&#9835;</text>
    <text x="485" y="200" text-anchor="middle" fill="#e5e7eb" font-size="8">Levitating</text>
    <text x="485" y="213" text-anchor="middle" fill="#6b7280" font-size="7">Dua Lipa</text>
    <!-- Status dots -->
    <circle cx="445" cy="125" r="5" fill="#1db954"/>
    <circle cx="457" cy="125" r="5" fill="#4ade80"/>

    <rect x="545" y="115" width="100" height="110" rx="4" fill="#1f2937"/>
    <rect x="545" y="115" width="100" height="70" rx="4" fill="#374151"/>
    <text x="595" y="155" text-anchor="middle" fill="#6b7280" font-size="24">&#9835;</text>
    <text x="595" y="200" text-anchor="middle" fill="#e5e7eb" font-size="8">Heat Waves</text>
    <text x="595" y="213" text-anchor="middle" fill="#6b7280" font-size="7">Glass Animals</text>
    <circle cx="555" cy="125" r="5" fill="#1db954"/>

    <rect x="655" y="115" width="100" height="110" rx="4" fill="#1f2937"/>
    <rect x="655" y="115" width="100" height="70" rx="4" fill="#4c1d95"/>
    <text x="705" y="155" text-anchor="middle" fill="#c4b5fd" font-size="24">&#9835;</text>
    <text x="705" y="200" text-anchor="middle" fill="#e5e7eb" font-size="8">Elephant</text>
    <text x="705" y="213" text-anchor="middle" fill="#6b7280" font-size="7">Tame Impala</text>
    <circle cx="665" cy="125" r="5" fill="#1db954"/>
    <circle cx="677" cy="125" r="5" fill="#4ade80"/>
    <circle cx="689" cy="125" r="5" fill="#c4b5fd"/>

    <rect x="435" y="235" width="100" height="110" rx="4" fill="#1f2937"/>
    <rect x="435" y="235" width="100" height="70" rx="4" fill="#374151"/>
    <text x="485" y="275" text-anchor="middle" fill="#6b7280" font-size="24">&#9835;</text>
    <text x="485" y="320" text-anchor="middle" fill="#e5e7eb" font-size="8">Latch</text>
    <text x="485" y="333" text-anchor="middle" fill="#6b7280" font-size="7">Disclosure</text>

    <rect x="545" y="235" width="100" height="110" rx="4" fill="#1f2937"/>
    <rect x="545" y="235" width="100" height="70" rx="4" fill="#374151"/>
    <text x="595" y="275" text-anchor="middle" fill="#6b7280" font-size="24">&#9835;</text>
    <text x="595" y="320" text-anchor="middle" fill="#e5e7eb" font-size="8">Blinding Lights</text>
    <text x="595" y="333" text-anchor="middle" fill="#6b7280" font-size="7">The Weeknd</text>
  </g>

  <!-- Legend -->
  <circle cx="450" cy="358" r="5" fill="#1db954"/>
  <text x="460" y="362" fill="#6b7280" font-size="8">Spotify</text>
  <circle cx="510" cy="358" r="5" fill="#4ade80"/>
  <text x="520" y="362" fill="#6b7280" font-size="8">Downloaded</text>
  <circle cx="590" cy="358" r="5" fill="#c4b5fd"/>
  <text x="600" y="362" fill="#6b7280" font-size="8">Processed</text>

  <!-- === FRAME 3: List View === -->
  <text x="1000" y="90" text-anchor="middle" fill="#9ca3af" font-size="10" font-weight="bold">3. LIST VIEW + ACTIONS</text>
  <rect x="820" y="100" width="360" height="260" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>

  <!-- Header row -->
  <rect x="835" y="115" width="330" height="18" rx="2" fill="#1f2937"/>
  <text x="850" y="127" fill="#6b7280" font-size="8">Title</text>
  <text x="1000" y="127" fill="#6b7280" font-size="8">BPM</text>
  <text x="1045" y="127" fill="#6b7280" font-size="8">Key</text>
  <text x="1090" y="127" fill="#6b7280" font-size="8">Actions</text>

  <!-- Track rows -->
  <rect x="835" y="135" width="330" height="22" rx="2" fill="#1e3a5f"/>
  <text x="850" y="150" fill="#93c5fd" font-size="9">Dua Lipa — Levitating</text>
  <text x="1000" y="150" fill="#f59e0b" font-size="9">128</text>
  <text x="1045" y="150" fill="#9ca3af" font-size="9">Am</text>
  <text x="1090" y="148" fill="#7c3aed" font-size="9" font-weight="bold">&#9654; &#8741; &#9998;</text>

  <rect x="835" y="159" width="330" height="22" rx="2" fill="#111827"/>
  <text x="850" y="174" fill="#d1d5db" font-size="9">Glass Animals — Heat Waves</text>
  <text x="1000" y="174" fill="#f59e0b" font-size="9">81</text>
  <text x="1045" y="174" fill="#9ca3af" font-size="9">Fm</text>
  <text x="1090" y="172" fill="#7c3aed" font-size="9" font-weight="bold">&#9654; &#8741; &#9998;</text>

  <rect x="835" y="183" width="330" height="22" rx="2" fill="#111827"/>
  <text x="850" y="198" fill="#d1d5db" font-size="9">Tame Impala — Elephant</text>
  <text x="1000" y="198" fill="#f59e0b" font-size="9">116</text>
  <text x="1045" y="198" fill="#9ca3af" font-size="9">E</text>
  <text x="1090" y="196" fill="#7c3aed" font-size="9" font-weight="bold">&#9654; &#8741; &#9998;</text>

  <rect x="835" y="207" width="330" height="22" rx="2" fill="#111827"/>
  <text x="850" y="222" fill="#d1d5db" font-size="9">Disclosure — Latch</text>
  <text x="1000" y="222" fill="#f59e0b" font-size="9">122</text>
  <text x="1045" y="222" fill="#9ca3af" font-size="9">Ab</text>
  <text x="1090" y="220" fill="#7c3aed" font-size="9" font-weight="bold">&#9654; &#8741; &#9998;</text>

  <rect x="835" y="231" width="330" height="22" rx="2" fill="#111827"/>
  <text x="850" y="246" fill="#d1d5db" font-size="9">The Weeknd — Blinding Lights</text>
  <text x="1000" y="246" fill="#f59e0b" font-size="9">171</text>
  <text x="1045" y="246" fill="#9ca3af" font-size="9">Fm</text>
  <text x="1090" y="244" fill="#7c3aed" font-size="9" font-weight="bold">&#9654; &#8741; &#9998;</text>

  <!-- Context menu -->
  <rect x="1090" y="255" width="65" height="70" rx="4" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
  <text x="1122" y="271" text-anchor="middle" fill="#d1d5db" font-size="8">Load DJ A</text>
  <line x1="1095" y1="277" x2="1150" y2="277" stroke="#374151" stroke-width="1"/>
  <text x="1122" y="291" text-anchor="middle" fill="#d1d5db" font-size="8">Open DAW</text>
  <line x1="1095" y1="298" x2="1150" y2="298" stroke="#374151" stroke-width="1"/>
  <text x="1122" y="313" text-anchor="middle" fill="#fca5a5" font-size="8">Delete</text>
  <text x="1000" y="345" text-anchor="middle" fill="#6b7280" font-size="9">&#9654; play  &#8741; pause  &#9998; edit metadata</text>
  <text x="1000" y="360" text-anchor="middle" fill="#6b7280" font-size="9">Right-click for Load DJ / Open DAW context menu</text>

  <!-- === FRAME 4: Analysis Sidebar === -->
  <text x="200" y="400" text-anchor="middle" fill="#9ca3af" font-size="10" font-weight="bold">4. ANALYSIS SIDEBAR</text>
  <rect x="20" y="410" width="360" height="250" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>

  <!-- Sidebar header -->
  <rect x="35" y="425" width="330" height="28" rx="4" fill="#1f2937"/>
  <text x="60" y="442" fill="#e5e7eb" font-size="10" font-weight="bold">Glass Animals — Heat Waves</text>
  <text x="340" y="442" text-anchor="end" fill="#4b5563" font-size="16">&#x2715;</text>

  <!-- Analysis data -->
  <text x="50" y="470" fill="#9ca3af" font-size="9" font-weight="bold">BPM</text>
  <text x="130" y="470" fill="#f59e0b" font-size="11" font-weight="bold">81.0</text>
  <text x="50" y="488" fill="#9ca3af" font-size="9" font-weight="bold">Key</text>
  <text x="130" y="488" fill="#93c5fd" font-size="11" font-weight="bold">F minor</text>
  <text x="50" y="506" fill="#9ca3af" font-size="9" font-weight="bold">Energy</text>
  <rect x="130" y="496" width="120" height="12" rx="3" fill="#1f2937"/>
  <rect x="130" y="496" width="75" height="12" rx="3" fill="#7c3aed"/>
  <text x="260" y="507" fill="#a78bfa" font-size="9">62%</text>

  <text x="50" y="524" fill="#9ca3af" font-size="9" font-weight="bold">Mode</text>
  <text x="130" y="524" fill="#d1d5db" font-size="9">Minor</text>
  <text x="50" y="540" fill="#9ca3af" font-size="9" font-weight="bold">Duration</text>
  <text x="130" y="540" fill="#d1d5db" font-size="9">3:59</text>

  <!-- Chroma visualization label -->
  <text x="50" y="558" fill="#9ca3af" font-size="9" font-weight="bold">Chroma</text>
  <g transform="translate(50, 565)">
    <rect x="0" y="0" width="18" height="30" rx="2" fill="#1e3a5f"/>
    <rect x="0" y="5" width="18" height="25" rx="2" fill="#3b82f6"/>
    <rect x="22" y="0" width="18" height="30" rx="2" fill="#1e3a5f"/>
    <rect x="22" y="12" width="18" height="18" rx="2" fill="#2563eb"/>
    <rect x="44" y="0" width="18" height="30" rx="2" fill="#1e3a5f"/>
    <rect x="44" y="20" width="18" height="10" rx="2" fill="#1d4ed8"/>
    <rect x="66" y="0" width="18" height="30" rx="2" fill="#1e3a5f"/>
    <rect x="66" y="8" width="18" height="22" rx="2" fill="#7c3aed"/>
    <rect x="88" y="0" width="18" height="30" rx="2" fill="#1e3a5f"/>
    <rect x="88" y="0" width="18" height="30" rx="2" fill="#4c1d95"/>
    <rect x="110" y="0" width="18" height="30" rx="2" fill="#1e3a5f"/>
    <rect x="110" y="18" width="18" height="12" rx="2" fill="#1d4ed8"/>
    <text x="0" y="40" fill="#6b7280" font-size="7">C</text>
    <text x="22" y="40" fill="#6b7280" font-size="7">D</text>
    <text x="44" y="40" fill="#6b7280" font-size="7">E</text>
    <text x="66" y="40" fill="#6b7280" font-size="7">F</text>
    <text x="88" y="40" fill="#6b7280" font-size="7">G</text>
    <text x="110" y="40" fill="#6b7280" font-size="7">A</text>
  </g>

  <text x="200" y="640" text-anchor="middle" fill="#6b7280" font-size="9">D3.js hooks: Radar, Chroma, Beats, MFCC, Spectral</text>
  <text x="200" y="654" text-anchor="middle" fill="#6b7280" font-size="9">Pull-tab panel; dedup prevents duplicate entries</text>

  <!-- === FRAME 5: Download Progress === -->
  <text x="600" y="400" text-anchor="middle" fill="#9ca3af" font-size="10" font-weight="bold">5. DOWNLOAD PROGRESS</text>
  <rect x="420" y="410" width="360" height="250" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>

  <!-- Download queue items -->
  <rect x="435" y="425" width="330" height="45" rx="4" fill="#1f2937"/>
  <text x="450" y="442" fill="#e5e7eb" font-size="10">Dua Lipa — Levitating</text>
  <rect x="450" y="448" width="200" height="10" rx="3" fill="#1e3a5f"/>
  <rect x="450" y="448" width="200" height="10" rx="3" fill="#4ade80"/>
  <text x="655" y="457" fill="#4ade80" font-size="9">Complete</text>

  <rect x="435" y="477" width="330" height="45" rx="4" fill="#1f2937"/>
  <text x="450" y="494" fill="#e5e7eb" font-size="10">Glass Animals — Heat Waves</text>
  <rect x="450" y="500" width="200" height="10" rx="3" fill="#1e3a5f"/>
  <rect x="450" y="500" width="130" height="10" rx="3" fill="#3b82f6"/>
  <text x="655" y="509" fill="#3b82f6" font-size="9">65%</text>

  <rect x="435" y="529" width="330" height="45" rx="4" fill="#1f2937"/>
  <text x="450" y="546" fill="#e5e7eb" font-size="10">Tame Impala — Elephant</text>
  <rect x="450" y="552" width="200" height="10" rx="3" fill="#1e3a5f"/>
  <rect x="450" y="552" width="20" height="10" rx="3" fill="#f59e0b"/>
  <text x="655" y="561" fill="#f59e0b" font-size="9">10%</text>

  <rect x="435" y="580" width="330" height="30" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="450" y="598" fill="#6b7280" font-size="9">Disclosure — Latch</text>
  <text x="655" y="598" fill="#374151" font-size="9">Queued</text>

  <text x="600" y="635" text-anchor="middle" fill="#6b7280" font-size="9">Oban queue: max_attempts 3, unique per track</text>
  <text x="600" y="649" text-anchor="middle" fill="#6b7280" font-size="9">PubSub progress events update bar in realtime</text>

  <!-- === FRAME 6: Playback Toggle === -->
  <text x="1000" y="400" text-anchor="middle" fill="#9ca3af" font-size="10" font-weight="bold">6. LOCAL vs SPOTIFY PLAYBACK</text>
  <rect x="820" y="410" width="360" height="250" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>

  <!-- Toggle tabs -->
  <rect x="835" y="425" width="160" height="28" rx="4" fill="#7c3aed"/>
  <text x="915" y="442" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Local (Web Audio)</text>
  <rect x="1001" y="425" width="160" height="28" rx="4" fill="#1f2937"/>
  <text x="1081" y="442" text-anchor="middle" fill="#9ca3af" font-size="10">Spotify SDK</text>

  <!-- Local mode details -->
  <rect x="835" y="462" width="330" height="80" rx="4" fill="#0f172a" stroke="#7c3aed" stroke-width="1"/>
  <text x="850" y="480" fill="#c4b5fd" font-size="9" font-weight="bold">Local Web Audio Mode</text>
  <text x="850" y="496" fill="#6b7280" font-size="9">320kbps MP3  •  44.1kHz  •  Stereo</text>
  <text x="850" y="512" fill="#6b7280" font-size="9">File: /priv/static/audio/{track_id}.mp3</text>
  <text x="850" y="528" fill="#6b7280" font-size="9">Sub-5ms latency  •  Full waveform analysis</text>

  <!-- Spotify mode details -->
  <rect x="835" y="552" width="330" height="70" rx="4" fill="#0f172a" stroke="#1db954" stroke-width="1"/>
  <text x="850" y="570" fill="#4ade80" font-size="9" font-weight="bold">Spotify SDK Mode</text>
  <text x="850" y="586" fill="#6b7280" font-size="9">Requires Spotify Premium account</text>
  <text x="850" y="602" fill="#6b7280" font-size="9">Web Playback SDK — browser-native</text>
  <text x="850" y="618" fill="#6b7280" font-size="9">Fallback for tracks not yet downloaded</text>

  <text x="1000" y="643" text-anchor="middle" fill="#374151" font-size="9">PlaybackBus GenServer (US-C04) unifies state</text>
  <text x="1000" y="657" text-anchor="middle" fill="#374151" font-size="9">DJ tab routes downloaded tracks to AudioPlayerLive</text>
</svg>
